version: '3.8'

services:
  database:
    image: postgis/postgis:16-3.4
    container_name: railway_gate_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: railway_gate_assistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/001_init_postgis_schema.sql:/docker-entrypoint-initdb.d/001_init_postgis_schema.sql

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: railway_gate_backend
    environment:
      PORT: 5001
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@database:5432/railway_gate_assistant
      CORS_ORIGIN: "http://localhost:5173,http://localhost:80,http://localhost"
    ports:
      - "5001:5001"
    depends_on:
      - database

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: railway_gate_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
